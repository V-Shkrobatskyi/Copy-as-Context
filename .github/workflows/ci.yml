name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run check:browser-builds
      - run: npm run lint:firefox
        env:
          NO_UPDATE_NOTIFIER: '1'
      - run: npm run zip:firefox
      - run: npm run check:firefox-package
