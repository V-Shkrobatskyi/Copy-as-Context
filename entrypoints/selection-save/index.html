<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Save selected context — Copy as Context</title></head>
<body>
  <main>
    <header class="brand"><img src="/icon/48.png" width="40" height="40" alt="" aria-hidden="true" /><p>Copy as Context</p></header>
