<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Copy as Context synthetic quality test</title>
  </head>
  <body>
    <main aria-label="Workspace overview">
      <h1>Overview</h1>
      <section aria-label="Weekly activity">
        <p>Open tasks: 12</p>
        <button type="button">Create task</button>
      </section>

      <form aria-label="Workspace settings">
        <h2>Settings</h2>
        <label>Display name <input value="Synthetic workspace"></label>
        <label>Password <input type="password" value="synthetic-password-value"></label>
        <label><input type="checkbox" checked> Send weekly summary</label>
        <button type="button">Save settings</button>
      </form>

      <div role="tablist" aria-label="Workspace views">
        <button role="tab" aria-selected="true">Activity</button>
        <button role="tab" aria-selected="false">Members</button>
      </div>
      <section role="tabpanel" aria-label="Activity">Recent updates</section>

      <button type="button" aria-expanded="false">Advanced options</button>
      <section aria-label="Advanced options">Collapsed content remains available</section>

      <table>
        <caption>Recent tasks</caption>
        <thead><tr><th>Task</th><th>Status</th></tr></thead>
        <tbody><tr><td>Prepare release notes</td><td>In progress</td></tr></tbody>
      </table>

      <section role="dialog" aria-modal="true" aria-label="Archive workspace">
        <p>This cannot be undone.</p>
        <button type="button">Cancel</button>
        <button type="button">Archive</button>
      </section>

      <div role="menu" aria-label="Task actions">
        <button role="menuitem">Duplicate</button>
        <button role="menuitem">Delete</button>
      </div>

      <article aria-label="Release guide">
        <h2>Prepare the release</h2>
        <p>Review the exported context before sharing it.</p>
        <a href="https://example.test/guide?api_key=sk-proj_abcdefghijklmnopqrstuvwxyz">Read the guide</a>
        <img alt="Synthetic release checklist" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
      </article>
    </main>
  </body>
</html>
